[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zemlya-tabel-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic[email]>=2.0",
    "pydantic-settings",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt<4.0",
    "python-multipart",
    "httpx",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# F811 в тестах (444 срабатывания) — следствие приёма «общие фикстуры импортом
# из соседнего тест-файла»: `from tests.test_cell_company_change import headers,
# worker, ...` с `# noqa: F401`, а дальше те же имена приходят ПАРАМЕТРАМИ в
# тесты, и ruff видит затенение импорта. Настоящих дублей определения среди них
# нет (проверено: такой поймался бы колонкой 1, их ноль).
# Идиоматичное лечение — перенести общие фикстуры в `conftest.py`, откуда pytest
# берёт их без импорта. Это отдельная задача по тестам; пока глушим правило,
# чтобы линтер не тонул в 444 строках и был виден остальной сигнал.
"tests/*" = ["F811"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: интеграционные тесты на PostgreSQL (нужен TEST_POSTGRES_URL, иначе пропускаются)",
]
