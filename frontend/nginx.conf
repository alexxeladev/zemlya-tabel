# Обычная конфигурация: HTTP без шифрования (стенд за внешним прокси или
# препрод в локальной сети). Правила приложения — в nginx-app.conf, общем с
# конфигурацией HTTPS (deploy/nginx-https.conf), чтобы не завести вторую копию.
#
# Включить HTTPS: ./scripts/enable-https.sh --help
server {
    listen 80;
    server_name _;

    include /etc/nginx/app.conf;
}
