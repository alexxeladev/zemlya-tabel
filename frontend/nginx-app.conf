# Правила самого приложения: статика SPA, прокси /api, проверки.
# Подключается через include ДВУМЯ конфигурациями — обычной (HTTP, nginx.conf)
# и с TLS (deploy/nginx-https.conf). Одна копия на обе: разойдясь, они дали бы
# по HTTPS другое поведение, чем по HTTP, — и это вскрылось бы уже у людей.
#
# В образе лежит как /etc/nginx/app.conf (см. frontend/Dockerfile).

root /usr/share/nginx/html;
index index.html;

# Загрузка Excel-выгрузок и т.п.
client_max_body_size 20m;

# Сжатие: ответ табеля на 70 сотрудников — ~400 КБ JSON, бандл — ~1 МБ.
# Без gzip это едет по сети как есть (замер препрода: 86,7 МБ за сессию).
# JSON и JS жмутся примерно в 10 раз.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/json
    application/javascript
    application/x-javascript
    text/javascript
    text/css
    text/plain
    image/svg+xml;

# Ответы табеля не влезают в дефолтные 8×4 КБ, и nginx писал их во
# временный файл (в логе препрода — 75 предупреждений
# «buffered to a temporary file»).
proxy_buffers 32 16k;
proxy_buffer_size 16k;
proxy_busy_buffers_size 64k;

# API → backend (имя сервиса в compose-сети).
location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # $scheme, а не «http» константой: за TLS-блоком сюда приходит https, и
    # приложение должно видеть настоящую схему запроса.
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Живость (константа) и готовность (база + версия миграций, 503 при отказе).
location = /health {
    proxy_pass http://backend:8000/health;
}

location = /ready {
    proxy_pass http://backend:8000/ready;
}

# SPA: любые маршруты отдаём index.html (react-router).
location / {
    try_files $uri $uri/ /index.html;
}
