# Надстройка: TLS снимает ВНЕШНИЙ прокси (Cloudflare, корпоративный
# балансировщик), а стек остаётся на HTTP — но доступен только с самого
# сервера. Этап 4 п.4.4.
#
# Смысл один: пока порт 8080 открыт наружу, HTTPS на прокси обходится прямым
# запросом по HTTP, и пароли снова идут открытым текстом.
#
# Включается: ./scripts/enable-https.sh --behind-proxy
# Вручную:
#   docker compose --env-file .env.preprod \
#     -f docker-compose.preprod.yml -f docker-compose.behind-proxy.yml up -d

services:
  web:
    ports: !override
      # Слушаем только петлевой адрес: снаружи достучаться нельзя, прокси
      # ходит с этой же машины. Прокси на другом сервере — оставьте обычную
      # публикацию и закройте порт межсетевым экраном.
      - "127.0.0.1:${PREPROD_HTTP_PORT:-8080}:80"
