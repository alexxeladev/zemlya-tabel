# Конфигурация nginx с TLS. Этап 4 п.4.4.
#
# Монтируется поверх /etc/nginx/conf.d/default.conf контейнера web
# (docker-compose.https.yml), включается скриптом scripts/enable-https.sh.
# Сертификаты — в /etc/nginx/certs (том с хоста, deploy/certs).
#
# Правила приложения здесь НЕ повторяются: они подключаются тем же
# include /etc/nginx/app.conf, что и в обычной конфигурации.

# HTTP: только подтверждение владения доменом для Let's Encrypt и редирект.
server {
    listen 80;
    server_name _;

    # Проверка домена certbot-ом кладёт файл в общий том; без этой локации
    # сертификат не выпустится и не продлится.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Только современные версии: TLS 1.0/1.1 сняты с поддержки и браузерами.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Год без возврата на HTTP. Включается только вместе с рабочим
    # сертификатом: выдав его ошибочно, сайт нельзя открыть по HTTP до
    # истечения срока — браузер помнит заголовок.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    include /etc/nginx/app.conf;
}
